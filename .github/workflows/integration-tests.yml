name: Integration Tests

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  redis-postgres-integration:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omni -d omni_queue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_INTEGRATION_TESTS: 'true'
      REDIS_TEST_URL: redis://127.0.0.1:6379
      PG_TEST_URL: postgres://omni:omni@127.0.0.1:5432/omni_queue_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check-types

      - name: Redis integration tests
        working-directory: packages/redis-store
        run: npm run test:integration

      - name: Postgres integration tests
        working-directory: packages/postgres-store
        run: npm run test:integration
