name: Integration Tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'packages/core/**'
      - 'packages/redis-store/**'
      - 'packages/postgres-store/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'packages/core/**'
      - 'packages/redis-store/**'
      - 'packages/postgres-store/**'
  workflow_dispatch:

jobs:
  redis-postgres-integration:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vasto
          POSTGRES_PASSWORD: vasto
          POSTGRES_DB: vasto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vasto -d vasto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RUN_INTEGRATION_TESTS: 'true'
      REDIS_TEST_URL: redis://127.0.0.1:6379
      PG_TEST_URL: postgres://vasto:vasto@127.0.0.1:5432/vasto_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install local workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build local workspace packages
        run: >-
          npm run build
          --workspace @vasto-queue/core
          --workspace @vasto-queue/redis-store
          --workspace @vasto-queue/postgres-store

      - name: Typecheck local workspace packages
        run: >-
          npm exec -- tsc --noEmit -p packages/core/tsconfig.json
          && npm exec -- tsc --noEmit -p packages/redis-store/tsconfig.json
          && npm exec -- tsc --noEmit -p packages/postgres-store/tsconfig.json

      - name: Redis integration tests
        run: npm run test:integration --workspace @vasto-queue/redis-store

      - name: Postgres integration tests
        run: npm run test:integration --workspace @vasto-queue/postgres-store
