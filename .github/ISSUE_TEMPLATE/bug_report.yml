name: Bug report
description: Report a reproducible bug in vasto.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail for us to reproduce quickly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal, deterministic steps to reproduce.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Paste relevant logs, stack traces, or screenshots.
      render: shell

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 20.12.2
    validations:
      required: true

  - type: input
    id: npm
    attributes:
      label: npm version
      placeholder: e.g. 10.8.1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 14.6 / Ubuntu 22.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: Affected package(s)
      description: Which workspace package(s) are affected?
      placeholder: e.g. @vasto/core, @vasto/hono-adapter
    validations:
      required: true
