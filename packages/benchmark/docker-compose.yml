services:
  redis:
    image: redis:7-alpine
    container_name: vasto-bench-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: vasto-bench-postgres
    environment:
      POSTGRES_DB: vasto_bench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vasto_bench"]
      interval: 5s
      timeout: 3s
      retries: 10
